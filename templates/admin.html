<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
body{font-family:Inter,system-ui;background:#0b1220;color:#e8eef8;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:20px}
table{width:100%;border-collapse:collapse} td,th{border-bottom:1px solid #243049;padding:8px;text-align:left}
a,button{color:#93c5fd} .ok{color:#22c55e} .bad{color:#f87171}
</style></head>
<body>
<div class="wrap">
  <h1>Admin approvals</h1>
  <p><a href="/logout">Logout</a></p>
  <table>
    <tr><th>Email</th><th>Status</th><th>Created</th><th></th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.email }}</td>
      <td>{{ u.status }}</td>
      <td>{{ u.created_at }}</td>
      <td>
        {% if u.status=='pending' %}
        <a class="ok" href="/admin/approve/{{ u.approve_token }}">Approve</a>
        · <a class="bad" href="/admin/reject/{{ u.approve_token }}">Reject</a>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
</body></html>
